<!doctype html>
<html lang="en" style="background-color: #1a1f2e;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Tools</title>
  <script>
    (function () {
      try {
        if (window.location.pathname === '/menubar') {
          document.documentElement.classList.add('panel-window');
          document.documentElement.style.backgroundColor = 'transparent';
          return;
        }
        const savedTheme = localStorage.getItem('app-theme-preference');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const shouldBeDark = savedTheme === 'dark' || ((!savedTheme || savedTheme === 'system') && systemDark);

        document.documentElement.style.backgroundColor = shouldBeDark ? '#1a1f2e' : '#FAFBFC';

        if (shouldBeDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        console.error('Failed to apply theme during boot:', e);
      }
    })();
  </script>
  <style>
    /* Critical CSS: Initial splash background for main window only */
    html:not(.panel-window) {
      background-color: #1a1f2e;
    }
    html.panel-window {
      background-color: transparent !important;
    }
    body {
      margin: 0;
      background-color: transparent;
    }
    html.panel-window body {
      background-color: transparent !important;
    }
  </style>
</head>

<body>




  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
