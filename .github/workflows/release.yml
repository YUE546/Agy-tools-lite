name: Release

# 打 tag（v*）时自动出包；也可以在 Actions 页面手动指定已有 tag 补出某个平台的安装包。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加安装包的 tag（例如 v4.7.5）"
        required: true
        default: v4.7.5
      ref:
        description: "用哪个分支/提交来构建（留空则用 tag 本身）"
        required: false
        default: ""
      build_macos:
        description: "同时重新构建 macOS 包"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || (github.event_name == 'push' && github.ref_name) || inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # 保险：若 npm ci 没有拿到 Windows 版 CLI 原生包，就直接从 registry 解包放进去。
      # （不动 package.json / lockfile，避免 npm 重新解析依赖把 Tauri 包升到不匹配的版本）
      - name: Ensure the Windows tauri CLI binary
        shell: bash
        run: |
          set -euo pipefail
          if node -e "require('@tauri-apps/cli-win32-x64-msvc')" 2>/dev/null; then
            echo "native CLI already present"
            exit 0
          fi
          CLI_VERSION="$(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")"
          curl -sSL "https://registry.npmjs.org/@tauri-apps/cli-win32-x64-msvc/-/cli-win32-x64-msvc-${CLI_VERSION}.tgz" -o cli-win32.tgz
          mkdir -p node_modules/@tauri-apps/cli-win32-x64-msvc
          tar -xzf cli-win32.tgz -C node_modules/@tauri-apps/cli-win32-x64-msvc --strip-components=1
          node -e "require('@tauri-apps/cli-win32-x64-msvc')" && echo "native CLI resolved"

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Publish installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          VERSION="$(node -p "require('./package.json').version")"
          ASSET_NAME="Antigravity-Tools-Lite-${VERSION}-windows-x64-setup.exe"
          INSTALLER="$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)"
          cp "$INSTALLER" "$ASSET_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Antigravity Tools Lite $VERSION" --generate-notes
          gh release upload "$TAG" "$ASSET_NAME" --clobber
          echo "uploaded $ASSET_NAME to $TAG"

  macos:
    name: macOS (Apple Silicon)
    if: github.event_name == 'push' || inputs.build_macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || (github.event_name == 'push' && github.ref_name) || inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app bundle
        run: npm run tauri build -- --bundles app

      - name: Publish app bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          VERSION="$(node -p "require('./package.json').version")"
          ASSET_NAME="Antigravity-Tools-Lite-${VERSION}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/release/bundle/macos/Antigravity Tools Lite.app" \
            "$ASSET_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Antigravity Tools Lite $VERSION" --generate-notes
          gh release upload "$TAG" "$ASSET_NAME" --clobber
          echo "uploaded $ASSET_NAME to $TAG"
