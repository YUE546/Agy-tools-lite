name: Release

# 打 tag（v*）时自动出包；也可以在 Actions 页面手动指定已有 tag 补出某个平台的安装包。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加安装包的 tag（例如 v4.7.3）"
        required: true
        default: v4.7.3
      build_macos:
        description: "同时重新构建 macOS 包"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Publish installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          VERSION="$(node -p "require('./package.json').version")"
          ASSET_NAME="Antigravity-Tools-Lite-${VERSION}-windows-x64-setup.exe"
          INSTALLER="$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)"
          cp "$INSTALLER" "$ASSET_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Antigravity Tools Lite $VERSION" --generate-notes
          gh release upload "$TAG" "$ASSET_NAME" --clobber
          echo "uploaded $ASSET_NAME to $TAG"

  macos:
    name: macOS (Apple Silicon)
    if: github.event_name == 'push' || inputs.build_macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app bundle
        run: npm run tauri build -- --bundles app

      - name: Publish app bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          VERSION="$(node -p "require('./package.json').version")"
          ASSET_NAME="Antigravity-Tools-Lite-${VERSION}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/release/bundle/macos/Antigravity Tools Lite.app" \
            "$ASSET_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Antigravity Tools Lite $VERSION" --generate-notes
          gh release upload "$TAG" "$ASSET_NAME" --clobber
          echo "uploaded $ASSET_NAME to $TAG"
